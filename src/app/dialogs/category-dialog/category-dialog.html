<h1 mat-dialog-title>{{ data ? 'Edit' : 'Add' }} Category</h1>
<div mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col space-y-4 pt-4">
    <mat-form-field appearance="outline">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Icon (e.g., fas fa-server)</mat-label>
      <input matInput formControlName="icon">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description">
    </mat-form-field>

    <mat-slide-toggle formControlName="enabled">Enabled</mat-slide-toggle>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!form.valid" (click)="onSave()">Save</button>
</div>
