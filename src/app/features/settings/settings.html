<div class="settings-container p-8 max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Settings</h1>

  <div class="space-y-8">
    <!-- Appearance Section -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Appearance</h2>
      <mat-radio-group class="flex flex-col space-y-2">
        <mat-radio-button value="system">System</mat-radio-button>
        <mat-radio-button value="light">Light</mat-radio-button>
        <mat-radio-button value="dark">Dark</mat-radio-button>
      </mat-radio-group>
    </section>

    <!-- Color Section -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Color</h2>
      <mat-radio-group class="flex flex-col space-y-2">
        <mat-radio-button value="system">System</mat-radio-button>
        <mat-radio-button value="predefined">Predefined</mat-radio-button>
        <mat-radio-button value="custom">Custom</mat-radio-button>
      </mat-radio-group>
      <mat-form-field appearance="outline" class="mt-4 w-full md:w-1/3">
        <mat-label>Color Scheme</mat-label>
        <mat-select [value]="'sunset'">
          <mat-option value="sunset">Sunset</mat-option>
          <mat-option value="ocean">Ocean</mat-option>
        </mat-select>
      </mat-form-field>
    </section>

    <!-- Server Section -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Server</h2>
      <mat-form-field class="w-full">
        <mat-label>Backend Base URL</mat-label>
        <input matInput value="https://testbackend.friehome.net">
        <mat-hint>Use http://10.0.2.2 for a local server on your host machine when using an Android Emulator.</mat-hint>
      </mat-form-field>
    </section>
  </div>

  <div class="mt-8">
    <button mat-flat-button color="primary" class="w-full">Save and Validate</button>
  </div>
</div>
